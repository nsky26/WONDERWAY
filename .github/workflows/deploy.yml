name: Deploy WonderWay to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: |
          npx ng build --configuration production --base-href /WONDERWAY/
          cp ./docs/index.csr.html ./docs/index.html || true
          cp ./docs/index.csr.html ./docs/404.html || true
          cp ./docs/index.csr.html ./index.html || true
          cp ./docs/index.csr.html ./404.html || true
          if [ -d "./docs/browser" ]; then cp -r ./docs/browser/* ./docs/ || true; fi

      - name: Commit and Push Built Site to Main
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/ index.html 404.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Update root & docs static build for GitHub Pages [skip ci]"
          git push origin main || true
